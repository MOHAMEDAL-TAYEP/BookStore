spring.application.name=BookStore

# Notice the '?createDatabaseIfNotExist=true' at the end of the URL
# spring.datasource.url=jdbc:mysql://localhost:3306/BookStore?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BookStore?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# This creates and drops your tables inside the BookStore database automatically
spring.jpa.hibernate.ddl-auto= create-drop
#spring.jpa.hibernate.ddl-auto= update

# Show SQL queries in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

app.admin.email=${ADMIN_EMAIL:admin@bookstore.com}
app.admin.password=${ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}